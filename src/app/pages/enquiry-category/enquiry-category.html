<div class="container mt-4">
  <h2>Generate Custom Report</h2>

  <!-- Filter Options -->
  <div class="row mb-4">
    <div class="col-md-3">
      <label for="status">Enquiry Status:</label>
      <select id="status" class="form-control" [(ngModel)]="statusFilter" (change)="filterData()">
        <option value="all">All</option>
        <option value="new">New</option>
        <option value="in-progress">In Progress</option>
        <option value="resolved">Resolved</option>
        <option value="closed">Closed</option>
      </select>
    </div>

    <div class="col-md-3">
      <label for="enquiryType">Enquiry Type:</label>
      <select id="enquiryType" class="form-control" [(ngModel)]="enquiryTypeFilter" (change)="filterData()">
        <option value="all">All</option>
        <option value="online">Online</option>
        <option value="walk in">Walk-in</option>
        <option value="phone">Phone</option>
      </select>
    </div>

    <div class="col-md-6">
      <label for="dateRange">Date Range:</label>
      <div class="d-flex">
        <input type="date" id="startDate" class="form-control me-3" [(ngModel)]="startDateFilter" (change)="filterData()" />
        <input type="date" id="endDate" class="form-control" [(ngModel)]="endDateFilter" (change)="filterData()" />
      </div>
    </div>
  </div>

  <!-- Report Summary Preview -->
  <h3>Report Summary</h3>
  <table class="table table-striped" *ngIf="filteredEnquiries.length">
    <thead>
      <tr>
        <th>Name</th>
        <th>Enquiry Type</th>
        <th>Enquiry Date</th>
        <th>Follow-Up Date</th>
        <th>Feedback</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let enquiry of filteredEnquiries">
        <td>{{ enquiry.customerName }}</td>
        <td>{{ enquiry.enquiryType }}</td>
        <td>{{ enquiry.enquiryDate | date }}</td>
        <td>{{ enquiry.followUpDate | date }}</td>
        <td>{{ enquiry.feedback }}</td>
      </tr>
    </tbody>
  </table>

  <!-- Export Buttons -->
  <div class="mt-4">
    <button class="btn btn-success me-3" (click)="exportToCSV()">Export as CSV</button>
    <button class="btn btn-info ml-3" (click)="exportToExcel()">Export as Excel</button>
  </div>
</div>
